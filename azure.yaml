# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.16'
name: dialog360
resourceGroup: ${AZURE_RESOURCE_GROUP}
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5-mini
        model:
          format: OpenAI
          name: gpt-5-mini
          version: '2025-08-07'
        sku:
          name: GlobalStandard
          capacity: 10
  d360-sql-agent:
    host: azure.ai.agent
    project: src/d360-sql-agent
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: d360-sql-agent.dll
    docker:
      path: src/d360-sql-agent/Dockerfile
      context: src/d360-sql-agent
      remoteBuild: true
    uses:
      - ai-project
    kind: hosted
    name: d360-sql-agent
    displayName: Dialog360 SQL Agent
    description: Generates structured report requests for the Dialog360 API; it does not access or execute SQL.
    metadata:
      tags:
        - AI Agent Hosting
        - Azure AI AgentServer
        - Responses Protocol
        - Agent Framework
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  api:
    host: containerapp
    project: .
    language: docker
    docker:
      path: Dockerfile
      remoteBuild: true
infra:
  provider: microsoft.foundry
